name: Check Rewards

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install requests beautifulsoup4

      - run: python flipkart_monitor.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status
          path: status.json
